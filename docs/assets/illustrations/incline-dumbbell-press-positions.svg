<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 380" width="1520" height="760" role="img" aria-label="上斜啞鈴臥推俯視示意，人體採肌群區塊畫法。左：底部，啞鈴在胸口兩側，手壓在手肘正上方代表前臂垂直，手肘斜收。右：頂端，兩顆啞鈴回到肩關節上方，彼此靠近但不互撞。">
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
  <defs>
    <clipPath id="upper"><rect x="-200" y="-40" width="400" height="262"/></clipPath>
    <g id="half">
      <polygon points="0,40 8,40 9,52 0,54" fill="#eef1f6"/>
      <polygon points="0,183 31,182 33,193 0,201" fill="#eef1f6"/>
      <g fill="#cbd3df" stroke="#ffffff" stroke-width="1" stroke-linejoin="round">
        <polygon points="9,46 34,59 12,60"/>
        <polygon points="2,62 32,62 36,77 2,80"/>
        <polygon points="2,83 37,80 41,94 36,109 18,115 2,112"/>
        <polygon points="5,119 15,119 18,122 18,133 15,136 5,136 2,133 2,122"/>
        <polygon points="5,139 15,139 18,142 18,153 15,156 5,156 2,153 2,142"/>
        <polygon points="5,159 15,159 18,162 18,176 15,179 5,179 2,176 2,162"/>
        <polygon points="21,118 37,112 36,140 32,174 21,180"/>
        <polygon points="4,205 34,197 40,228 37,276 29,298 12,298 5,258" clip-path="url(#upper)"/>
      </g>
    </g>
    <g id="arm" stroke="#ffffff" stroke-width="1" stroke-linejoin="round">
      <polygon points="35,59 48,57 52,72 47,96 43,93 39,77"/>
      <polygon points="49,56 58,61 64,74 62,92 54,99 49,96 54,72"/>
      <polygon points="49,102 59,101 65,116 64,139 58,150 52,142 49,122"/>
      <polygon points="42,106 46,102 47,122 50,143 46,146 41,126"/>
    </g>
    <!-- 啞鈴（俯視：握把＋兩端槓片），中心在原點 -->
    <g id="db">
      <rect x="-12" y="-2.5" width="24" height="5" rx="1.5" fill="#6c798e"/>
      <rect x="-20" y="-12" width="8" height="24" rx="2" fill="#cbd3df" stroke="#9aa6b8" stroke-width="0.8"/>
      <rect x="12" y="-12" width="8" height="24" rx="2" fill="#cbd3df" stroke="#9aa6b8" stroke-width="0.8"/>
    </g>
    <g id="fist">
      <polygon points="-5,-8 5,-8 9,-4 9,4 5,8 -5,8 -9,4 -9,-4" fill="#1b4f9c"/>
      <rect x="-6" y="-5" width="12" height="10" rx="3" fill="#ffffff" stroke="#1b4f9c" stroke-width="0.8"/>
    </g>
    <marker id="dim" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 1 L10 5 L0 9 Z" fill="#6c798e"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="759" height="379" rx="12" fill="#ffffff" stroke="#e1e6ee"/>
  <text x="28" y="36" font-size="15" font-weight="800" fill="#112f5d">啞鈴位置：底部與頂端</text>
  <text x="28" y="56" font-size="11.5" fill="#6c798e">俯視上斜椅上的人：底部啞鈴在胸口兩側、手在手肘正上方；頂端回到肩關節上方，靠近但不互撞</text>
  <line x1="380" y1="72" x2="380" y2="364" stroke="#e1e6ee"/>
  <text x="28" y="84" font-size="12" font-weight="700" fill="#3a4456">俯視：底部（下放到底）</text>
  <text x="400" y="84" font-size="12" font-weight="700" fill="#3a4456">俯視：頂端（推到頂）</text>

  <!-- 左：底部 -->
  <g transform="translate(190 118)">
    <rect x="-30" y="28" width="60" height="194" rx="6" fill="#f6f8fb" stroke="#e1e6ee"/>
    <ellipse cx="0" cy="22" rx="15" ry="19" fill="#eef1f6"/>
    <use href="#half"/>
    <use href="#half" transform="scale(-1 1)"/>
    <g fill="#cbd3df">
      <use href="#arm" transform="translate(47 68) rotate(-53) scale(1 0.8) translate(-47 -68)"/>
      <use href="#arm" transform="scale(-1 1) translate(47 68) rotate(-53) scale(1 0.8) translate(-47 -68)"/>
    </g>
    <use href="#db" transform="translate(106 99)"/>
    <use href="#db" transform="translate(-106 99)"/>
    <use href="#fist" transform="translate(106 99)"/>
    <use href="#fist" transform="translate(-106 99)"/>
    <line x1="64" y1="78" x2="64" y2="222" stroke="#cbd3df" stroke-dasharray="3 3"/>
    <line x1="-64" y1="78" x2="-64" y2="222" stroke="#cbd3df" stroke-dasharray="3 3"/>
    <line x1="-62" y1="216" x2="62" y2="216" stroke="#6c798e" stroke-width="0.9" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <rect x="-15" y="210" width="30" height="13" fill="#ffffff"/>
    <text x="0" y="220" font-size="10.5" fill="#6c798e" text-anchor="middle">肩寬</text>
    <line x1="113" y1="112" x2="120" y2="138" stroke="#1b4f9c" stroke-width="0.8"/>
    <text x="110" y="151" font-size="10.5" font-weight="700" fill="#1b4f9c">手在手肘正上方</text>
    <text x="110" y="165" font-size="10.5" font-weight="700" fill="#1b4f9c">＝前臂垂直</text>
    <line x1="-118" y1="88" x2="-130" y2="52" stroke="#6c798e" stroke-width="0.8"/>
    <text x="-150" y="44" font-size="10.5" font-weight="700" fill="#3a4456">啞鈴在胸口兩側</text>
  </g>

  <!-- 右：頂端 -->
  <g transform="translate(570 118)">
    <rect x="-30" y="28" width="60" height="194" rx="6" fill="#f6f8fb" stroke="#e1e6ee"/>
    <ellipse cx="0" cy="22" rx="15" ry="19" fill="#eef1f6"/>
    <use href="#half"/>
    <use href="#half" transform="scale(-1 1)"/>
    <g fill="#cbd3df">
      <use href="#arm" transform="translate(47 68) rotate(25) scale(1 0.3) translate(-47 -68)"/>
      <use href="#arm" transform="scale(-1 1) translate(47 68) rotate(25) scale(1 0.3) translate(-47 -68)"/>
    </g>
    <use href="#db" transform="translate(38 74)"/>
    <use href="#db" transform="translate(-38 74)"/>
    <use href="#fist" transform="translate(38 74)"/>
    <use href="#fist" transform="translate(-38 74)"/>
    <line x1="47" y1="68" x2="47" y2="150" stroke="#9aa6b8" stroke-width="0.8" stroke-dasharray="2 3"/>
    <line x1="-47" y1="68" x2="-47" y2="150" stroke="#9aa6b8" stroke-width="0.8" stroke-dasharray="2 3"/>
    <circle cx="47" cy="68" r="2.2" fill="#3a4456"/>
    <circle cx="-47" cy="68" r="2.2" fill="#3a4456"/>
    <line x1="-16" y1="74" x2="16" y2="74" stroke="#ed9b26" stroke-width="0.9" marker-start="url(#dim)" marker-end="url(#dim)"/>
    <line x1="0" y1="70" x2="0" y2="-2" stroke="#ed9b26" stroke-width="0.8"/>
    <text x="0" y="-8" font-size="10.5" font-weight="700" fill="#c7641a" text-anchor="middle">留一點間距，不互撞</text>
    <line x1="56" y1="66" x2="92" y2="40" stroke="#6c798e" stroke-width="0.8"/>
    <text x="72" y="32" font-size="10.5" font-weight="700" fill="#3a4456">肩關節上方</text>
  </g>

  <rect x="400" y="354" width="10" height="10" rx="2" fill="#1b4f9c"/>
  <text x="415" y="363" font-size="11.5" fill="#3a4456">手在手肘正上方（前臂垂直）</text>
  <rect x="594" y="354" width="10" height="10" rx="2" fill="#ed9b26"/>
  <text x="609" y="363" font-size="11.5" fill="#3a4456">頂端啞鈴間距</text>
</svg>
