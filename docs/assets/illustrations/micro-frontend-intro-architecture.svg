<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" width="1520" height="680" role="img" aria-label="從單體前端到微前端：左側是單體前端，一個程式碼庫裡塞著頁首、側欄、內容、頁尾四個區塊，所有團隊共用同一次建置與部署；右側是微前端，把 Web 應用垂直切成 Team A 到 Team D 四條切片，每一條都有自己的前端應用、微服務與資料庫，可以獨立開發、部署與運行，最後由容器應用在瀏覽器中聚合成同一個頁面。">
  <defs>
    <marker id="mf-ar-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b4f9c"/>
    </marker>
    <marker id="mf-ar-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e37b24"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
  </style>
  <rect width="760" height="340" rx="12" fill="#f6f8fb"/>
  <text x="28" y="34" font-size="15" font-weight="800" fill="#112f5d">從單體前端到微前端：把應用垂直切成可獨立部署的切片</text>

  <!-- 左：單體 -->
  <rect x="28" y="56" width="212" height="256" rx="10" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="44" y="78" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.06em">MONOLITH 單體前端</text>
  <rect x="44" y="90" width="180" height="150" rx="8" fill="#eef4fb" stroke="#d6e4f5" stroke-width="1.25"/>
  <text x="134" y="108" font-size="10.5" font-weight="700" fill="#6c798e" text-anchor="middle">單一程式碼庫、單一框架</text>
  <g font-size="10.5" fill="#1b4f9c" font-weight="700">
    <rect x="56" y="116" width="156" height="22" rx="4" fill="#ffffff" stroke="#adc8e8" stroke-width="1"/>
    <text x="134" y="131" text-anchor="middle">頁首</text>
    <rect x="56" y="142" width="44" height="52" rx="4" fill="#ffffff" stroke="#adc8e8" stroke-width="1"/>
    <text x="78" y="172" text-anchor="middle">側欄</text>
    <rect x="104" y="142" width="108" height="52" rx="4" fill="#ffffff" stroke="#adc8e8" stroke-width="1"/>
    <text x="158" y="172" text-anchor="middle">內容</text>
    <rect x="56" y="198" width="156" height="22" rx="4" fill="#ffffff" stroke="#adc8e8" stroke-width="1"/>
    <text x="134" y="213" text-anchor="middle">頁尾</text>
  </g>
  <line x1="134" y1="240" x2="134" y2="262" stroke="#e37b24" stroke-width="1.5" marker-end="url(#mf-ar-orange)"/>
  <rect x="56" y="266" width="156" height="30" rx="6" fill="#fdf4e6" stroke="#e37b24" stroke-width="1"/>
  <text x="134" y="280" font-size="10.5" font-weight="800" fill="#a04f15" text-anchor="middle">一次建置、一次部署</text>
  <text x="134" y="291" font-size="9" fill="#a04f15" text-anchor="middle">任何團隊改一行都要全站上線</text>

  <!-- 中：轉換箭頭 -->
  <line x1="248" y1="184" x2="290" y2="184" stroke="#1b4f9c" stroke-width="1.5" marker-end="url(#mf-ar-navy)"/>

  <!-- 右：微前端 -->
  <rect x="300" y="56" width="432" height="256" rx="10" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="316" y="78" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.06em">MICRO FRONTENDS 微前端</text>

  <!-- 容器應用（聚合後的頁面） -->
  <rect x="316" y="88" width="400" height="40" rx="6" fill="#1b4f9c"/>
  <text x="330" y="106" font-size="11" font-weight="800" fill="#ffffff">容器應用（Host / Shell）</text>
  <text x="330" y="120" font-size="9.5" fill="#d6e4f5">在瀏覽器中把各團隊的前端應用聚合成同一個頁面</text>

  <!-- 四條垂直切片 -->
  <g font-size="10" text-anchor="middle">
    <!-- 欄框 -->
    <rect x="316" y="138" width="94" height="164" rx="6" fill="#eef4fb" stroke="#d6e4f5" stroke-width="1"/>
    <rect x="418" y="138" width="94" height="164" rx="6" fill="#eef4fb" stroke="#d6e4f5" stroke-width="1"/>
    <rect x="520" y="138" width="94" height="164" rx="6" fill="#eef4fb" stroke="#d6e4f5" stroke-width="1"/>
    <rect x="622" y="138" width="94" height="164" rx="6" fill="#eef4fb" stroke="#d6e4f5" stroke-width="1"/>
    <!-- 欄標題 -->
    <text x="363" y="152" font-weight="800" fill="#112f5d">Team A</text>
    <text x="465" y="152" font-weight="800" fill="#112f5d">Team B</text>
    <text x="567" y="152" font-weight="800" fill="#112f5d">Team C</text>
    <text x="669" y="152" font-weight="800" fill="#112f5d">Team D</text>
    <!-- 三層 -->
    <g fill="#ffffff" stroke="#adc8e8" stroke-width="1">
      <rect x="324" y="160" width="78" height="34" rx="4"/><rect x="426" y="160" width="78" height="34" rx="4"/><rect x="528" y="160" width="78" height="34" rx="4"/><rect x="630" y="160" width="78" height="34" rx="4"/>
      <rect x="324" y="210" width="78" height="34" rx="4"/><rect x="426" y="210" width="78" height="34" rx="4"/><rect x="528" y="210" width="78" height="34" rx="4"/><rect x="630" y="210" width="78" height="34" rx="4"/>
    </g>
    <g fill="#ffffff" stroke="#adc8e8" stroke-width="1">
      <path d="M324 266 a39 6 0 0 1 78 0 v20 a39 6 0 0 1 -78 0 Z"/><ellipse cx="363" cy="266" rx="39" ry="6"/>
      <path d="M426 266 a39 6 0 0 1 78 0 v20 a39 6 0 0 1 -78 0 Z"/><ellipse cx="465" cy="266" rx="39" ry="6"/>
      <path d="M528 266 a39 6 0 0 1 78 0 v20 a39 6 0 0 1 -78 0 Z"/><ellipse cx="567" cy="266" rx="39" ry="6"/>
      <path d="M630 266 a39 6 0 0 1 78 0 v20 a39 6 0 0 1 -78 0 Z"/><ellipse cx="669" cy="266" rx="39" ry="6"/>
    </g>
    <g fill="#1b4f9c" font-weight="700">
      <text x="363" y="174">前端應用</text><text x="465" y="174">前端應用</text><text x="567" y="174">前端應用</text><text x="669" y="174">前端應用</text>
    </g>
    <g fill="#6c798e" font-size="9" class="mono">
      <text x="363" y="187">React</text><text x="465" y="187">Vue</text><text x="567" y="187">Angular</text><text x="669" y="187">Svelte</text>
    </g>
    <g fill="#3a4456" font-weight="700">
      <text x="363" y="231">微服務</text><text x="465" y="231">微服務</text><text x="567" y="231">微服務</text><text x="669" y="231">微服務</text>
      <text x="363" y="281">資料庫</text><text x="465" y="281">資料庫</text><text x="567" y="281">資料庫</text><text x="669" y="281">資料庫</text>
    </g>
    <!-- 層間連線 -->
    <g stroke="#adc8e8" stroke-width="1">
      <line x1="363" y1="194" x2="363" y2="210"/><line x1="465" y1="194" x2="465" y2="210"/><line x1="567" y1="194" x2="567" y2="210"/><line x1="669" y1="194" x2="669" y2="210"/>
      <line x1="363" y1="244" x2="363" y2="260"/><line x1="465" y1="244" x2="465" y2="260"/><line x1="567" y1="244" x2="567" y2="260"/><line x1="669" y1="244" x2="669" y2="260"/>
    </g>
    <!-- 前端應用 → 容器 -->
    <g stroke="#1b4f9c" stroke-width="1.25">
      <line x1="363" y1="160" x2="363" y2="132" marker-end="url(#mf-ar-navy)"/>
      <line x1="465" y1="160" x2="465" y2="132" marker-end="url(#mf-ar-navy)"/>
      <line x1="567" y1="160" x2="567" y2="132" marker-end="url(#mf-ar-navy)"/>
      <line x1="669" y1="160" x2="669" y2="132" marker-end="url(#mf-ar-navy)"/>
    </g>
  </g>

  <!-- 底部說明 -->
  <g font-size="10" fill="#3a4456">
    <text x="28" y="328">每一條垂直切片由一個團隊完整負責：獨立開發、獨立部署、獨立運行，框架也可以各自選擇。</text>
  </g>
</svg>
