<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 410" width="1520" height="820" role="img" aria-label="AppModule 的組裝方式：左側 imports 中，ConfigModule 為全域模組，以 ConfigService 提供設定給 TypeOrmModule 與 ThrottlerModule；TypeOrmModule 的 DataSource 供 HealthModule 做 SELECT 1 健康檢查；MetricsModule 提供 MetricsService。右側是全域掛載：configure() 對所有路由套用 HelmetMiddleware 與 TraceMiddleware，APP_GUARD 為 ThrottlerGuard，APP_INTERCEPTOR 為 LoggingInterceptor 與 ResponseInterceptor，APP_FILTER 為 AllExceptionsFilter；MetricsService 以 Optional 方式注入 LoggingInterceptor 與 AllExceptionsFilter。下方 main.ts 的 bootstrap 負責 Swagger、openapi.json、優雅關機與程序層級例外處理。">
  <defs>
    <marker id="ar-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b4f9c"/>
    </marker>
    <marker id="ar-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e37b24"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .mono, .mono text { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="409" rx="12" fill="#ffffff" stroke="#e1e6ee"/>
  <text x="28" y="34" font-size="15" font-weight="800" fill="#112f5d">AppModule 怎麼把基礎建設組起來</text>

  <!-- 欄標 -->
  <text x="28" y="64" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.08em">IMPORTS · 模組</text>
  <text x="400" y="64" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.08em">GLOBAL · 全域掛載到每個請求</text>
  <line x1="380" y1="54" x2="380" y2="300" stroke="#e1e6ee" stroke-width="1"/>

  <!-- ConfigModule -->
  <rect x="28" y="74" width="332" height="48" rx="8" fill="#eef4fb" stroke="#1b4f9c" stroke-width="1.25"/>
  <text x="42" y="94" font-size="12.5" font-weight="800" fill="#112f5d">ConfigModule</text>
  <text x="140" y="94" font-size="10" font-weight="800" fill="#1b4f9c">isGlobal</text>
  <text x="42" y="111" font-size="10.5" fill="#6c798e">讀取 .env（NODE_ENV=test 時略過）</text>

  <!-- ConfigService 往下 -->
  <path d="M108 122 V146" fill="none" stroke="#1b4f9c" stroke-width="1.5" marker-end="url(#ar-navy)"/>
  <path d="M280 122 V146" fill="none" stroke="#1b4f9c" stroke-width="1.5" marker-end="url(#ar-navy)"/>
  <text x="194" y="139" font-size="9.5" font-weight="800" fill="#1b4f9c" text-anchor="middle" class="mono">ConfigService</text>

  <!-- TypeOrmModule -->
  <rect x="28" y="150" width="160" height="56" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="42" y="171" font-size="12.5" font-weight="800" fill="#112f5d">TypeOrmModule</text>
  <text x="42" y="188" font-size="10" fill="#6c798e" class="mono">better-sqlite3</text>
  <text x="42" y="200" font-size="10" fill="#6c798e" class="mono">DATABASE_PATH</text>

  <!-- ThrottlerModule -->
  <rect x="200" y="150" width="160" height="56" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="214" y="171" font-size="12.5" font-weight="800" fill="#112f5d">ThrottlerModule</text>
  <text x="214" y="188" font-size="10" fill="#6c798e" class="mono">THROTTLE_TTL</text>
  <text x="214" y="200" font-size="10" fill="#6c798e" class="mono">THROTTLE_LIMIT</text>

  <!-- DataSource 往下 -->
  <path d="M108 206 V232" fill="none" stroke="#1b4f9c" stroke-width="1.5" marker-end="url(#ar-navy)"/>
  <text x="116" y="223" font-size="9.5" font-weight="800" fill="#1b4f9c" class="mono">DataSource</text>

  <!-- HealthModule -->
  <rect x="28" y="236" width="160" height="56" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="42" y="257" font-size="12.5" font-weight="800" fill="#112f5d">HealthModule</text>
  <text x="42" y="274" font-size="10" fill="#6c798e" class="mono">GET /health</text>
  <text x="42" y="286" font-size="10" fill="#6c798e">SELECT 1 深度檢查</text>

  <!-- MetricsModule -->
  <rect x="200" y="236" width="160" height="56" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="214" y="257" font-size="12.5" font-weight="800" fill="#112f5d">MetricsModule</text>
  <text x="214" y="274" font-size="10" fill="#6c798e" class="mono">GET /metrics</text>
  <text x="214" y="286" font-size="10" fill="#6c798e">MetricsService</text>

  <!-- 右欄：全域 -->
  <rect x="400" y="74" width="332" height="48" rx="8" fill="#ffffff" stroke="#e37b24" stroke-width="1.25"/>
  <text x="414" y="94" font-size="10" font-weight="800" fill="#a04f15" letter-spacing="0.04em">MIDDLEWARE</text>
  <text x="496" y="94" font-size="10" fill="#6c798e" class="mono">configure() · forRoutes("*")</text>
  <text x="414" y="112" font-size="11.5" font-weight="800" fill="#112f5d" class="mono">HelmetMiddleware → TraceMiddleware</text>

  <rect x="400" y="150" width="332" height="40" rx="8" fill="#ffffff" stroke="#e37b24" stroke-width="1.25"/>
  <text x="414" y="174" font-size="10" font-weight="800" fill="#a04f15" letter-spacing="0.04em">APP_GUARD</text>
  <text x="520" y="174" font-size="11.5" font-weight="800" fill="#112f5d" class="mono">ThrottlerGuard</text>

  <rect x="400" y="200" width="332" height="48" rx="8" fill="#ffffff" stroke="#e37b24" stroke-width="1.25"/>
  <text x="414" y="219" font-size="10" font-weight="800" fill="#a04f15" letter-spacing="0.04em">APP_INTERCEPTOR</text>
  <text x="414" y="237" font-size="11.5" font-weight="800" fill="#112f5d" class="mono">LoggingInterceptor → ResponseInterceptor</text>

  <rect x="400" y="258" width="332" height="40" rx="8" fill="#ffffff" stroke="#e37b24" stroke-width="1.25"/>
  <text x="414" y="282" font-size="10" font-weight="800" fill="#a04f15" letter-spacing="0.04em">APP_FILTER</text>
  <text x="520" y="282" font-size="11.5" font-weight="800" fill="#112f5d" class="mono">AllExceptionsFilter</text>

  <!-- ThrottlerModule → APP_GUARD -->
  <path d="M360 170 H396" fill="none" stroke="#1b4f9c" stroke-width="1.5" marker-end="url(#ar-navy)"/>
  <!-- MetricsService → Interceptor / Filter（選用注入） -->
  <path d="M360 256 C378 256 378 230 396 230" fill="none" stroke="#e37b24" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ar-orange)"/>
  <path d="M360 272 C378 272 378 278 396 278" fill="none" stroke="#e37b24" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ar-orange)"/>
  <text x="732" y="314" font-size="9.5" fill="#a04f15" text-anchor="end">虛線：MetricsService 以 @Optional() 注入，沒有也能運作</text>

  <!-- main.ts -->
  <rect x="28" y="326" width="704" height="64" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="42" y="346" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.06em">main.ts · bootstrap()</text>
  <g font-size="10.5" font-weight="700">
    <rect x="42" y="356" width="128" height="24" rx="12" fill="#eef4fb" stroke="#adc8e8"/>
    <text x="106" y="372" text-anchor="middle" fill="#1b4f9c">Swagger /api-docs</text>
    <rect x="178" y="356" width="104" height="24" rx="12" fill="#eef4fb" stroke="#adc8e8"/>
    <text x="230" y="372" text-anchor="middle" fill="#1b4f9c" class="mono">/openapi.json</text>
    <rect x="290" y="356" width="200" height="24" rx="12" fill="#eef4fb" stroke="#adc8e8"/>
    <text x="390" y="372" text-anchor="middle" fill="#1b4f9c">SIGTERM / SIGINT 優雅關機</text>
    <rect x="498" y="356" width="222" height="24" rx="12" fill="#eef4fb" stroke="#adc8e8"/>
    <text x="609" y="372" text-anchor="middle" fill="#1b4f9c">uncaughtException 結構化記錄</text>
  </g>
</svg>
