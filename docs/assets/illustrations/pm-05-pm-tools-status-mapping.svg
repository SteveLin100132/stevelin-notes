<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 300" width="1640" height="600" role="img" aria-label="兩套狀態的對照。上排是我的習慣：Open、On Going、Done、Verified、Closed；下排是一般作法：To Do、In Progress、Done。Open 對應 To Do，On Going 對應 In Progress，我的 Done、Verified、Closed 三個狀態都落在一般作法的 Done 裡。拆出來之後，Done 到 Verified 的驗收耗時、Verified 到 Closed 的結案耗時才量得到。Pending 與 Cancelled 從 On Going 分出，是離開流動而不是主線狀態。">
  <defs>
    <marker id="sm-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b4f9c"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
  <rect width="820" height="300" rx="12" fill="#f6f8fb"/>

  <text x="24" y="30" font-size="15" font-weight="800" fill="#112f5d">同一條流程，後段的細緻度不同</text>

  <!-- 離開流動 -->
  <g stroke="#cbd3df" stroke-width="1.25" stroke-dasharray="4 3" fill="none">
    <path d="M315 96 L 272 72"/>
    <path d="M315 96 L 362 72"/>
  </g>
  <rect x="232" y="50" width="80" height="22" rx="11" fill="#ffffff" stroke="#cbd3df" stroke-width="1"/>
  <text x="272" y="65" font-size="10.5" font-weight="700" fill="#6c798e" text-anchor="middle">Pending 暫離</text>
  <rect x="322" y="50" width="86" height="22" rx="11" fill="#ffffff" stroke="#cbd3df" stroke-width="1"/>
  <text x="365" y="65" font-size="10.5" font-weight="700" fill="#6c798e" text-anchor="middle">Cancelled 退出</text>

  <!-- 可量化區間 -->
  <g stroke="#e37b24" stroke-width="1.5" fill="none">
    <path d="M459 90 V 80 H 593 V 90"/>
    <path d="M603 90 V 80 H 737 V 90"/>
  </g>
  <g font-size="11" font-weight="800" fill="#a04f15" text-anchor="middle">
    <text x="526" y="72">驗收耗時</text>
    <text x="670" y="72">結案耗時</text>
  </g>

  <!-- 上排：我的習慣 -->
  <text x="24" y="119" font-size="12" font-weight="800" fill="#1b4f9c">我的習慣</text>
  <g fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25">
    <rect x="120" y="96" width="110" height="36" rx="6"/>
    <rect x="260" y="96" width="110" height="36" rx="6"/>
    <rect x="400" y="96" width="110" height="36" rx="6"/>
    <rect x="540" y="96" width="110" height="36" rx="6"/>
  </g>
  <rect x="680" y="96" width="110" height="36" rx="6" fill="#e8f5ee" stroke="#2e9e6b" stroke-width="1.25"/>
  <g font-size="12" font-weight="800" fill="#112f5d" text-anchor="middle">
    <text x="175" y="113">Open</text>
    <text x="315" y="113">On Going</text>
    <text x="455" y="113">Done</text>
    <text x="595" y="113">Verified</text>
    <text x="735" y="113" fill="#2e9e6b">Closed</text>
  </g>
  <g font-size="10" fill="#6c798e" text-anchor="middle">
    <text x="175" y="126">待辦</text>
    <text x="315" y="126">進行中</text>
    <text x="455" y="126">待驗收</text>
    <text x="595" y="126">待結案</text>
    <text x="735" y="126">已結案</text>
  </g>
  <g stroke="#1b4f9c" stroke-width="1.25">
    <line x1="232" y1="114" x2="256" y2="114" marker-end="url(#sm-arr)"/>
    <line x1="372" y1="114" x2="396" y2="114" marker-end="url(#sm-arr)"/>
    <line x1="512" y1="114" x2="536" y2="114" marker-end="url(#sm-arr)"/>
    <line x1="652" y1="114" x2="676" y2="114" marker-end="url(#sm-arr)"/>
  </g>

  <!-- 對應線 -->
  <g stroke="#adc8e8" stroke-width="1" stroke-dasharray="3 3">
    <line x1="175" y1="132" x2="175" y2="200"/>
    <line x1="315" y1="132" x2="315" y2="200"/>
    <line x1="455" y1="132" x2="455" y2="200"/>
    <line x1="595" y1="132" x2="595" y2="200"/>
    <line x1="735" y1="132" x2="735" y2="200"/>
  </g>

  <!-- 下排：一般作法 -->
  <text x="24" y="223" font-size="12" font-weight="800" fill="#6c798e">一般作法</text>
  <g fill="#ffffff" stroke="#cbd3df" stroke-width="1.25">
    <rect x="120" y="200" width="110" height="36" rx="6"/>
    <rect x="260" y="200" width="110" height="36" rx="6"/>
  </g>
  <rect x="400" y="200" width="390" height="36" rx="6" fill="#e1e6ee" stroke="#cbd3df" stroke-width="1.25"/>
  <g font-size="12" font-weight="800" fill="#3a4456" text-anchor="middle">
    <text x="175" y="223">To Do</text>
    <text x="315" y="223">In Progress</text>
    <text x="595" y="217">Done</text>
  </g>
  <text x="595" y="230" font-size="10" fill="#6c798e" text-anchor="middle">驗收與結案都包在這一格，量不到各花多久</text>
  <g stroke="#cbd3df" stroke-width="1.25">
    <line x1="232" y1="218" x2="256" y2="218"/>
    <line x1="372" y1="218" x2="396" y2="218"/>
  </g>

  <text x="24" y="272" font-size="11" fill="#3a4456">把壓在 Done 裡的「驗收」與「結案」拉出來成為狀態，流程看起來變長，但這兩段的耗時可以被量化，瓶頸才看得見。</text>
</svg>
