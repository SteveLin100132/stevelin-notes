<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" width="1600" height="480" role="img" aria-label="一個產品的生命裡會包著好幾個專案。上排是產品，一條沒有終點、持續迭代的長條；下排是三個有起點與終點的專案：專案 A 是 v1.0 開發上線，專案 B 是金流串接，專案 C 是 v2.0 改版；每個專案驗收結案後，成果併入產品繼續經營。">
  <defs>
    <marker id="ns-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b4f9c"/>
    </marker>
    <marker id="ns-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#cbd3df"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
  <rect width="800" height="240" rx="12" fill="#f6f8fb"/>

  <text x="24" y="32" font-size="15" font-weight="800" fill="#112f5d">不是二選一：一個產品的生命裡，會包著好幾個專案</text>

  <!-- 產品 -->
  <text x="24" y="82" font-size="12" font-weight="800" fill="#a04f15">產品</text>
  <path d="M120 62 H 752 L 772 77 L 752 92 H 120 Z" fill="#fdf4e6" stroke="#e37b24" stroke-width="1.25"/>
  <text x="136" y="82" font-size="12" font-weight="800" fill="#a04f15">持續迭代、持續經營，沒有預設終點</text>
  <g stroke="#fbe7c6" stroke-width="1.5">
    <line x1="356" y1="70" x2="356" y2="84"/>
    <line x1="388" y1="70" x2="388" y2="84"/>
    <line x1="420" y1="70" x2="420" y2="84"/>
    <line x1="452" y1="70" x2="452" y2="84"/>
    <line x1="484" y1="70" x2="484" y2="84"/>
    <line x1="516" y1="70" x2="516" y2="84"/>
    <line x1="548" y1="70" x2="548" y2="84"/>
    <line x1="580" y1="70" x2="580" y2="84"/>
    <line x1="612" y1="70" x2="612" y2="84"/>
    <line x1="644" y1="70" x2="644" y2="84"/>
    <line x1="676" y1="70" x2="676" y2="84"/>
    <line x1="708" y1="70" x2="708" y2="84"/>
  </g>
  <text x="708" y="108" font-size="10" fill="#6c798e" text-anchor="end">專案之間仍有日常迭代</text>

  <!-- 併入產品 -->
  <g stroke="#1b4f9c" stroke-width="1.25" stroke-dasharray="4 3" marker-end="url(#ns-arr)">
    <line x1="330" y1="136" x2="330" y2="96"/>
    <line x1="540" y1="136" x2="540" y2="96"/>
    <line x1="750" y1="136" x2="750" y2="96"/>
  </g>
  <text x="336" y="122" font-size="10" fill="#1b4f9c">驗收後併入產品</text>

  <!-- 專案 -->
  <text x="24" y="162" font-size="12" font-weight="800" fill="#1b4f9c">專案</text>
  <g fill="#1b4f9c">
    <rect x="130" y="140" width="200" height="34" rx="3"/>
    <rect x="380" y="140" width="160" height="34" rx="3"/>
    <rect x="590" y="140" width="160" height="34" rx="3"/>
  </g>
  <g stroke="#112f5d" stroke-width="2.5">
    <line x1="130" y1="134" x2="130" y2="180"/>
    <line x1="330" y1="134" x2="330" y2="180"/>
    <line x1="380" y1="134" x2="380" y2="180"/>
    <line x1="540" y1="134" x2="540" y2="180"/>
    <line x1="590" y1="134" x2="590" y2="180"/>
    <line x1="750" y1="134" x2="750" y2="180"/>
  </g>
  <g font-size="11.5" font-weight="800" fill="#ffffff">
    <text x="142" y="162">專案 A：v1.0 開發上線</text>
    <text x="392" y="162">專案 B：金流串接</text>
    <text x="602" y="162">專案 C：v2.0 改版</text>
  </g>
  <g font-size="10.5" fill="#6c798e">
    <text x="130" y="196">有期限、有預算，驗收後結案</text>
    <text x="380" y="196">一次性的整合任務</text>
    <text x="590" y="196">範疇明確的大改版</text>
  </g>

  <line x1="120" y1="216" x2="772" y2="216" stroke="#cbd3df" stroke-width="1" marker-end="url(#ns-gray)"/>
  <text x="776" y="232" font-size="10" fill="#6c798e" text-anchor="end">時間</text>
</svg>
