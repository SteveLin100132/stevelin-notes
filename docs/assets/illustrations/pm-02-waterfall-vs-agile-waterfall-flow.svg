<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 260" width="1600" height="520" role="img" aria-label="Waterfall 的推進方式：需求、設計、開發、測試、上線五個階段依序進行，每個階段結尾有里程碑審查；每階段產出 PRD、SDD、原始碼、測試報告、上線手冊等文件交接給下一階段；客戶在前四個階段都看不到可用成果，直到上線才一次交付。">
  <defs>
    <marker id="wf-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#adc8e8"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
  <rect width="800" height="260" rx="12" fill="#f6f8fb"/>

  <text x="24" y="32" font-size="15" font-weight="800" fill="#112f5d">Waterfall：文件一路往下傳，最後一次交付</text>

  <!-- 列標 -->
  <g font-size="11" font-weight="800" fill="#6c798e">
    <text x="24" y="82">階段</text>
    <text x="24" y="136">交付文件</text>
    <text x="24" y="204">客戶可用</text>
    <text x="24" y="218">的成果</text>
  </g>

  <!-- 階段條（x = 120 + 133i，寬 124） -->
  <g fill="#1b4f9c">
    <rect x="120" y="64" width="124" height="28" rx="4"/>
    <rect x="253" y="64" width="124" height="28" rx="4"/>
    <rect x="386" y="64" width="124" height="28" rx="4"/>
    <rect x="519" y="64" width="124" height="28" rx="4"/>
    <rect x="652" y="64" width="124" height="28" rx="4"/>
  </g>
  <g font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">
    <text x="182" y="83">需求</text>
    <text x="315" y="83">設計</text>
    <text x="448" y="83">開發</text>
    <text x="581" y="83">測試</text>
    <text x="714" y="83">上線</text>
  </g>

  <!-- 里程碑審查閘門 -->
  <g fill="#ffffff" stroke="#112f5d" stroke-width="1.25">
    <path d="M248.5 71 l 6 7 l -6 7 l -6 -7 Z"/>
    <path d="M381.5 71 l 6 7 l -6 7 l -6 -7 Z"/>
    <path d="M514.5 71 l 6 7 l -6 7 l -6 -7 Z"/>
    <path d="M647.5 71 l 6 7 l -6 7 l -6 -7 Z"/>
  </g>
  <text x="248.5" y="56" font-size="10" fill="#6c798e" text-anchor="middle">里程碑審查</text>

  <!-- 交付文件 -->
  <g fill="#eef4fb" stroke="#1b4f9c" stroke-width="1.1">
    <path d="M130 114 h 20 l 8 8 v 26 h -28 Z"/>
    <path d="M263 114 h 20 l 8 8 v 26 h -28 Z"/>
    <path d="M396 114 h 20 l 8 8 v 26 h -28 Z"/>
    <path d="M529 114 h 20 l 8 8 v 26 h -28 Z"/>
    <path d="M662 114 h 20 l 8 8 v 26 h -28 Z"/>
  </g>
  <g fill="none" stroke="#1b4f9c" stroke-width="1.1">
    <path d="M150 114 v 8 h 8"/>
    <path d="M283 114 v 8 h 8"/>
    <path d="M416 114 v 8 h 8"/>
    <path d="M549 114 v 8 h 8"/>
    <path d="M682 114 v 8 h 8"/>
  </g>
  <g font-size="11" font-weight="700" fill="#112f5d">
    <text x="166" y="130">PRD</text>
    <text x="299" y="130">SDD</text>
    <text x="432" y="130">原始碼</text>
    <text x="565" y="130">測試報告</text>
    <text x="698" y="130">上線手冊</text>
  </g>
  <g font-size="10" fill="#6c798e">
    <text x="166" y="145">需求規格</text>
    <text x="299" y="145">設計規格</text>
    <text x="432" y="145">建置產出</text>
    <text x="565" y="145">驗證紀錄</text>
    <text x="698" y="145">維運交接</text>
  </g>
  <!-- 文件交接 -->
  <g stroke="#adc8e8" stroke-width="1.25" stroke-dasharray="4 3">
    <line x1="226" y1="140" x2="258" y2="140" marker-end="url(#wf-arr)"/>
    <line x1="359" y1="140" x2="391" y2="140" marker-end="url(#wf-arr)"/>
    <line x1="492" y1="140" x2="524" y2="140" marker-end="url(#wf-arr)"/>
    <line x1="625" y1="140" x2="657" y2="140" marker-end="url(#wf-arr)"/>
  </g>

  <!-- 客戶可用的成果 -->
  <rect x="120" y="190" width="523" height="30" rx="4" fill="#ffffff" stroke="#cbd3df" stroke-width="1.25" stroke-dasharray="5 4"/>
  <text x="381" y="209" font-size="11.5" fill="#6c798e" text-anchor="middle">前四個階段：客戶看不到可用的東西，只看到文件與進度報告</text>
  <rect x="652" y="190" width="124" height="30" rx="4" fill="#2e9e6b"/>
  <text x="714" y="209" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">一次交付</text>

  <line x1="120" y1="240" x2="770" y2="240" stroke="#cbd3df" stroke-width="1" marker-end="url(#wf-arr)"/>
  <text x="120" y="254" font-size="10" fill="#6c798e">專案開始</text>
  <text x="776" y="254" font-size="10" fill="#6c798e" text-anchor="end">時間</text>
</svg>
