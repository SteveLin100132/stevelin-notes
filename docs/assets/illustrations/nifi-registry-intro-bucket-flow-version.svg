<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 320" width="1520" height="640" role="img" aria-label="NiFi Registry 的三層結構與 GitLab 的對照：一個 Registry 底下有多個 Bucket，每個 Bucket 包含多個 Flow，每個 Flow 有一條由 v1、v2、v3 依序遞增的版本線。Bucket 對應 GitLab 的 Group，Flow 對應 Project，Version 對應一次 commit。與 Git 不同的是 Registry 沒有 branch，每條 Flow 只有一條直線的版本歷史，沒有 merge 或 rebase。">
  <defs>
    <marker id="ar-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6c798e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
    .mono { font-family: 'JetBrains Mono', Consolas, 'Courier New', monospace; }
  </style>
  <rect x="0.5" y="0.5" width="759" height="319" rx="12" fill="#ffffff" stroke="#e1e6ee"/>
  <text x="28" y="34" font-size="15" font-weight="800" fill="#112f5d">Bucket 裝 Flow，Flow 長出版本</text>

  <!-- Registry container -->
  <rect x="28" y="52" width="476" height="244" rx="10" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.5"/>
  <text x="44" y="74" font-size="12" font-weight="800" fill="#1b4f9c">NiFi Registry</text>

  <!-- Bucket 1 -->
  <rect x="44" y="86" width="444" height="100" rx="8" fill="#eef4fb" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="58" y="106" font-size="11" font-weight="800" fill="#1b4f9c" letter-spacing="0.04em">BUCKET</text>
  <text x="114" y="106" font-size="11" fill="#3a4456" class="mono">etl-order</text>

  <g class="mono" font-size="10.5">
    <rect x="58" y="116" width="416" height="28" rx="5" fill="#ffffff" stroke="#e1e6ee"/>
    <text x="70" y="134" fill="#112f5d" font-weight="700">Flow</text>
    <text x="110" y="134" fill="#3a4456">order-sync</text>
    <line x1="240" y1="130" x2="440" y2="130" stroke="#adc8e8" stroke-width="1.5"/>
    <circle cx="240" cy="130" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="240" y="133.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v1</text>
    <circle cx="300" cy="130" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="300" y="133.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v2</text>
    <circle cx="360" cy="130" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="360" y="133.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v3</text>
    <circle cx="420" cy="130" r="8" fill="#1b4f9c"/>
    <text x="420" y="133.5" fill="#ffffff" font-size="8.5" text-anchor="middle" font-weight="700">v4</text>

    <rect x="58" y="150" width="416" height="28" rx="5" fill="#ffffff" stroke="#e1e6ee"/>
    <text x="70" y="168" fill="#112f5d" font-weight="700">Flow</text>
    <text x="110" y="168" fill="#3a4456">invoice-export</text>
    <line x1="240" y1="164" x2="300" y2="164" stroke="#adc8e8" stroke-width="1.5"/>
    <circle cx="240" cy="164" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="240" y="167.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v1</text>
    <circle cx="300" cy="164" r="8" fill="#1b4f9c"/>
    <text x="300" y="167.5" fill="#ffffff" font-size="8.5" text-anchor="middle" font-weight="700">v2</text>
  </g>

  <!-- Bucket 2 -->
  <rect x="44" y="196" width="444" height="66" rx="8" fill="#eef4fb" stroke="#adc8e8" stroke-width="1.25"/>
  <text x="58" y="216" font-size="11" font-weight="800" fill="#1b4f9c" letter-spacing="0.04em">BUCKET</text>
  <text x="114" y="216" font-size="11" fill="#3a4456" class="mono">etl-hr</text>
  <g class="mono" font-size="10.5">
    <rect x="58" y="226" width="416" height="28" rx="5" fill="#ffffff" stroke="#e1e6ee"/>
    <text x="70" y="244" fill="#112f5d" font-weight="700">Flow</text>
    <text x="110" y="244" fill="#3a4456">attendance-load</text>
    <line x1="240" y1="240" x2="360" y2="240" stroke="#adc8e8" stroke-width="1.5"/>
    <circle cx="240" cy="240" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="240" y="243.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v1</text>
    <circle cx="300" cy="240" r="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
    <text x="300" y="243.5" fill="#1b4f9c" font-size="8.5" text-anchor="middle" font-weight="700">v2</text>
    <circle cx="360" cy="240" r="8" fill="#1b4f9c"/>
    <text x="360" y="243.5" fill="#ffffff" font-size="8.5" text-anchor="middle" font-weight="700">v3</text>
  </g>
  <text x="58" y="284" font-size="10" fill="#6c798e">實心圓 = 最新版本；版本號只會往上加，沒有分支</text>

  <!-- Mapping -->
  <text x="530" y="74" font-size="10.5" font-weight="800" fill="#6c798e" letter-spacing="0.08em">對照 GITLAB</text>
  <g font-size="11.5">
    <rect x="530" y="86" width="202" height="46" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
    <text x="544" y="114" font-weight="800" fill="#1b4f9c">Bucket</text>
    <path d="M604 110 H640" stroke="#6c798e" stroke-width="1.25" marker-end="url(#ar-gray)"/>
    <text x="650" y="114" font-weight="700" fill="#3a4456">Group</text>

    <rect x="530" y="140" width="202" height="46" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
    <text x="544" y="168" font-weight="800" fill="#1b4f9c">Flow</text>
    <path d="M604 164 H640" stroke="#6c798e" stroke-width="1.25" marker-end="url(#ar-gray)"/>
    <text x="650" y="168" font-weight="700" fill="#3a4456">Project</text>

    <rect x="530" y="194" width="202" height="46" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
    <text x="544" y="222" font-weight="800" fill="#1b4f9c">Version</text>
    <path d="M604 218 H640" stroke="#6c798e" stroke-width="1.25" marker-end="url(#ar-gray)"/>
    <text x="650" y="222" font-weight="700" fill="#3a4456">Commit</text>
  </g>
  <rect x="530" y="250" width="202" height="46" rx="8" fill="#fdf4e6" stroke="#e37b24" stroke-width="1.25"/>
  <text x="544" y="270" font-size="11" font-weight="800" fill="#a04f15">沒有 Branch</text>
  <text x="544" y="287" font-size="10" fill="#a04f15">沒有 merge / rebase，只有一條主線</text>
</svg>
