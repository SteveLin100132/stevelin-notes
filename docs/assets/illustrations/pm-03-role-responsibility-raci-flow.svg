<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 376" width="1520" height="752" role="img" aria-label="RACI 權責流向：以 PRD 撰寫為例，PM 是 R 動手撰寫，PO 是 A 拍板簽核且只能一位，Tech Lead 是 C 在事前被徵詢、雙向溝通，QA 是 I 在事後被通知、單向溝通。下方時間軸依序為：事前徵詢 C、執行 R、拍板 A、事後通知 I。">
  <defs>
    <marker id="rf-navy" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#1b4f9c"/>
    </marker>
    <marker id="rf-orange" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#e37b24"/>
    </marker>
    <marker id="rf-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#6c798e"/>
    </marker>
  </defs>
  <style>
    text { font-family: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', sans-serif; }
  </style>
  <rect width="760" height="376" rx="12" fill="#f6f8fb"/>

  <text x="28" y="34" font-size="15" font-weight="800" fill="#112f5d">一項任務，四種權責</text>
  <text x="28" y="54" font-size="11" fill="#6c798e">以「PRD 撰寫」為例</text>

  <!-- A：上方 -->
  <rect x="285" y="44" width="190" height="48" rx="8" fill="#fdf4e6" stroke="#e37b24" stroke-width="1.5"/>
  <circle cx="309" cy="68" r="12" fill="#e37b24"/>
  <text x="309" y="72.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  <text x="330" y="64" font-size="13" font-weight="800" fill="#a04f15">PO</text>
  <text x="330" y="81" font-size="10.5" fill="#3a4456">Accountable 最終負責人</text>

  <!-- R：左側 -->
  <rect x="40" y="140" width="190" height="48" rx="8" fill="#ffffff" stroke="#1b4f9c" stroke-width="1.25"/>
  <circle cx="64" cy="164" r="12" fill="#1b4f9c"/>
  <text x="64" y="168.5" font-size="12" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>
  <text x="85" y="160" font-size="13" font-weight="800" fill="#112f5d">PM</text>
  <text x="85" y="177" font-size="10.5" fill="#3a4456">Responsible 執行者</text>

  <!-- C：右側 -->
  <rect x="530" y="140" width="190" height="48" rx="8" fill="#ffffff" stroke="#adc8e8" stroke-width="1.25"/>
  <circle cx="554" cy="164" r="12" fill="#d6e4f5"/>
  <text x="554" y="168.5" font-size="12" font-weight="800" fill="#1b4f9c" text-anchor="middle">C</text>
  <text x="575" y="160" font-size="13" font-weight="800" fill="#112f5d">Tech Lead</text>
  <text x="575" y="177" font-size="10.5" fill="#3a4456">Consulted 被諮詢者</text>

  <!-- I：下方 -->
  <rect x="285" y="236" width="190" height="48" rx="8" fill="#ffffff" stroke="#cbd3df" stroke-width="1.25"/>
  <circle cx="309" cy="260" r="12" fill="#e1e6ee"/>
  <text x="309" y="264.5" font-size="12" font-weight="800" fill="#3a4456" text-anchor="middle">I</text>
  <text x="330" y="256" font-size="13" font-weight="800" fill="#112f5d">QA</text>
  <text x="330" y="273" font-size="10.5" fill="#3a4456">Informed 被通知者</text>

  <!-- 任務卡 -->
  <rect x="320" y="126" width="120" height="76" rx="8" fill="#ffffff" stroke="#112f5d" stroke-width="1.5"/>
  <path d="M336 146 h 17 l 7 7 v 25 h -24 Z" fill="#eef4fb" stroke="#1b4f9c" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M353 146 v 7 h 7" fill="none" stroke="#1b4f9c" stroke-width="1.25" stroke-linejoin="round"/>
  <path d="M341 160 h 14 M341 165 h 14 M341 170 h 9" stroke="#1b4f9c" stroke-width="1" stroke-linecap="round"/>
  <text x="370" y="158" font-size="10" fill="#6c798e">任務</text>
  <text x="370" y="176" font-size="13" font-weight="800" fill="#112f5d">PRD 撰寫</text>

  <!-- A ↓ 任務：拍板 -->
  <line x1="380" y1="92" x2="380" y2="122" stroke="#e37b24" stroke-width="1.75" marker-end="url(#rf-orange)"/>
  <text x="390" y="112" font-size="10.5" font-weight="700" fill="#a04f15">拍板簽核 · 只能一位</text>

  <!-- R → 任務：動手 -->
  <line x1="230" y1="164" x2="316" y2="164" stroke="#1b4f9c" stroke-width="1.75" marker-end="url(#rf-navy)"/>
  <text x="273" y="156" font-size="10.5" font-weight="700" fill="#1b4f9c" text-anchor="middle">動手撰寫</text>
  <text x="273" y="182" font-size="9.5" fill="#6c798e" text-anchor="middle">可以多位</text>

  <!-- 任務 ↔ C：雙向 -->
  <line x1="444" y1="164" x2="526" y2="164" stroke="#1b4f9c" stroke-width="1.25" stroke-dasharray="5 4" marker-start="url(#rf-navy)" marker-end="url(#rf-navy)"/>
  <text x="485" y="156" font-size="10.5" font-weight="700" fill="#1b4f9c" text-anchor="middle">事前徵詢</text>
  <text x="485" y="182" font-size="9.5" fill="#6c798e" text-anchor="middle">雙向溝通</text>

  <!-- 任務 → I：單向 -->
  <line x1="380" y1="202" x2="380" y2="232" stroke="#6c798e" stroke-width="1.25" stroke-dasharray="5 4" marker-end="url(#rf-gray)"/>
  <text x="390" y="222" font-size="10.5" font-weight="700" fill="#6c798e">事後通知 · 單向溝通</text>

  <!-- 時間軸 -->
  <line x1="40" y1="306" x2="720" y2="306" stroke="#e1e6ee" stroke-width="1"/>
  <text x="40" y="330" font-size="11" font-weight="700" fill="#6c798e">時間順序</text>
  <line x1="110" y1="326" x2="716" y2="326" stroke="#cbd3df" stroke-width="1.5" marker-end="url(#rf-gray)"/>

  <circle cx="170" cy="326" r="11" fill="#d6e4f5"/>
  <text x="170" y="330.5" font-size="11" font-weight="800" fill="#1b4f9c" text-anchor="middle">C</text>
  <text x="170" y="356" font-size="10.5" fill="#3a4456" text-anchor="middle">事前：徵詢 Tech Lead</text>

  <circle cx="320" cy="326" r="11" fill="#1b4f9c"/>
  <text x="320" y="330.5" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">R</text>
  <text x="320" y="356" font-size="10.5" fill="#3a4456" text-anchor="middle">執行：PM 撰寫</text>

  <circle cx="470" cy="326" r="11" fill="#e37b24"/>
  <text x="470" y="330.5" font-size="11" font-weight="800" fill="#ffffff" text-anchor="middle">A</text>
  <text x="470" y="356" font-size="10.5" fill="#3a4456" text-anchor="middle">拍板：PO 簽核</text>

  <circle cx="620" cy="326" r="11" fill="#e1e6ee"/>
  <text x="620" y="330.5" font-size="11" font-weight="800" fill="#3a4456" text-anchor="middle">I</text>
  <text x="620" y="356" font-size="10.5" fill="#3a4456" text-anchor="middle">事後：通知 QA</text>
</svg>
